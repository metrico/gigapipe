# Docker stack for the reflected-XSS / Content-Type regression tests.
# Builds gigapipe from the current working tree so the tests run against local
# changes. Driven by run.sh.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.9.1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8123:8123"

  gigapipe:
    image: gigapipe-integration
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "9000"
      PORT: "3100"
      # Flush ingested spans quickly so the trace round-trip test stays fast.
      BULK_MAX_AGE_MS: "100"
    ports:
      - "3100:3100"

  # Readers over the same database with METRICS_READ_TIER forcing a tier.
  gigapipe-5m:
    image: gigapipe-integration
    pull_policy: never
    depends_on:
      gigapipe:
        condition: service_started
    environment:
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "9000"
      PORT: "3100"
      MODE: reader
      METRICS_READ_TIER: 5m
    ports:
      - "3101:3100"

  gigapipe-1h:
    image: gigapipe-integration
    pull_policy: never
    depends_on:
      gigapipe:
        condition: service_started
    environment:
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "9000"
      PORT: "3100"
      MODE: reader
      METRICS_READ_TIER: 1h
    ports:
      - "3102:3100"
