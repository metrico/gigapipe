# Docker stack for the reflected-XSS / Content-Type regression tests.
# Builds gigapipe from the current working tree so the tests run against local
# changes. Driven by run.sh.
services:
  clickhouse:
    extends:
      file: ../../scripts/test/docker-compose.clickhouse.yml
      service: clickhouse
    environment:
      # Newer images limit the passwordless default user to the container.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    # Published for the CI lane, which runs gigapipe on the host, and for the
    # tests that start their own gigapipe (migrations, ruler boot order) and
    # read ClickHouse over HTTP.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  gigapipe:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "9000"
      PORT: "3100"
      # Flush ingested spans quickly so the trace round-trip test stays fast.
      BULK_MAX_AGE_MS: "100"
    ports:
      - "3100:3100"
