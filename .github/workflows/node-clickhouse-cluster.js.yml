# This workflow will validate gigapipe using nodejs + clickhouse

name: Gigapipe CI Cluster

on:
  push:
    branches: [ master, beta ]
    paths:
      - '**'
      - '!**.md'
      - '!**.yml'
      - '!**.yaml'
      - 'scripts/test/**' # the stack this lane runs, including its images
  pull_request:
    branches: [ master, beta ]
    paths:
      - '**'
      - '!**.md'
      - '!**.yml'
      - '!**.yaml'
      - 'scripts/test/**' # the stack this lane runs, including its images

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check out the e2e test suite
      run: make e2e-deps
    - id: execution
      run: "make e2e-ci"
    - name: Rollback Deployment
      if: failure() && steps.execution.outcome == 'failure'
      run: npm test -- -u
