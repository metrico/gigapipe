# This workflow will validate gigapipe using nodejs + clickhouse
#
# Release-gate lane (#922): it starts on every PR but only does its work on a
# push to master, the nightly run, a manual run or a PR from a release/* branch.
# On any other PR the job below is skipped: the check shows as skipped, which
# counts as passing for required checks. The publish preflight doesn't accept
# a run whose job was skipped.

name: Gigapipe CI Cluster

on:
  push:
    branches: [ master, beta ]
    paths-ignore:
      - '**.md'
      - '**.yaml'
  pull_request:
    branches: [ master, beta ]
    paths-ignore:
      - '**.md'
      - '**.yaml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Pushes queue instead of piling up: one push run runs, the newest waits, and a
# newer push replaces the waiting one. Every other run has its own group, so a
# push never cancels a nightly, manual or PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check out the e2e test suite
      run: make e2e-deps
    - name: Install Compose
      uses: ndeloof/install-compose-action@v0.0.1
      with:
        version: v2.1.0 # defaults to 'latest'
        legacy: true    # will also install in PATH as `docker-compose`
    - id: execution
      run: "make e2e-ci"
    - name: Rollback Deployment
      if: failure() && steps.execution.outcome == 'failure'
      run: npm test -- -u
