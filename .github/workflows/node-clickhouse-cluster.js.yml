# This workflow will validate gigapipe using nodejs + clickhouse

name: QRYN CI CLUSTER

on:
  push:
    branches: [ master, beta ]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ master, beta ]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check out the e2e test suite
      run: make e2e-deps
    - name: Install Compose
      uses: ndeloof/install-compose-action@v0.0.1
      with:
        version: v2.1.0 # defaults to 'latest'
        legacy: true    # will also install in PATH as `docker-compose`
    - name: Workflow Telemetry
      uses: runforesight/workflow-telemetry-action@v1.8.7 
      if: github.event_name != 'pull_request'
    - id: execution
      run: "make e2e-ci"
    - name: Rollback Deployment
      if: failure() && steps.execution.outcome == 'failure'
      run: npm test -- -u
