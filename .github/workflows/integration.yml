name: Integration (reflected-XSS / Content-Type)

# Regression gate for the go/reflected-xss hardening: builds gigapipe from the
# PR source, runs it against a real ClickHouse, and asserts the traces (Tempo
# protobuf) and profiles (Connect) endpoints keep their correct negotiated
# Content-Type while every response carries X-Content-Type-Options: nosniff.
on:
  pull_request:
    branches: [ "master" ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.9.1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build gigapipe
        run: make build

      - name: Start gigapipe
        run: make integration-start

      - name: Run integration tests
        run: make test-integration

      - name: gigapipe logs on failure
        if: failure()
        run: cat gigapipe.log || true
