name: Integration (reflected-XSS / Content-Type)

# Regression gate for the go/reflected-xss hardening: builds gigapipe from the
# PR source, runs it against a real ClickHouse, and asserts the traces (Tempo
# protobuf) and profiles (Connect) endpoints keep their correct negotiated
# Content-Type while every response carries X-Content-Type-Options: nosniff.
on:
  pull_request:
    branches: [ "master" ]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build gigapipe
        run: make build

      # The image version lives in the compose file, shared with run.sh.
      - name: Start ClickHouse
        run: docker compose -f test/integration/docker-compose.yml up -d --wait clickhouse

      - name: Start gigapipe
        run: make integration-start

      - name: Run integration tests
        run: make test-integration

      - name: gigapipe logs on failure
        if: failure()
        run: cat gigapipe.log || true
