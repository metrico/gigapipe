name: Go Build CI

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Every lane runs through a Makefile recipe, so CI and local runs are the same
# commands.
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: gofmt
      run: make fmt-check

    - name: Build Gigapipe
      run: make build

    - name: Unit tests
      run: make test-unit

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # --new-from-rev needs the commit it compares against in the history.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # Only new issues fail the job (since the pull request's base commit, or
    # since the previous commit on a push), so adoption doesn't require
    # cleaning up pre-existing findings first.
    - name: golangci-lint
      run: make lint LINT_NEW_FROM_REV=${{ github.event.pull_request.base.sha || github.event.before }}
