name: Go Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Every lane runs through a Makefile recipe, so CI and local runs are the same
# commands.
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: gofmt
      run: make fmt-check

    - name: Build Gigapipe
      run: make build

    - name: Unit tests
      run: make test-unit

  # Pull requests only: `make lint` runs the latest golangci-lint, and a new
  # release of it must not fail master, which would block a release.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # --new-from-rev needs the commit it compares against in the history.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Only issues new since the pull request's base commit fail the job, so
    # adoption doesn't require cleaning up pre-existing findings first.
    - name: golangci-lint
      run: make lint LINT_NEW_FROM_REV=${{ github.event.pull_request.base.sha }}
