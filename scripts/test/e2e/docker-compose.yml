# small setup for e2e tests
networks:
  common:
    driver: bridge
services:
  e2e-aio:
    image: gigapipe:latest
    container_name: e2e.aio
    hostname: e2e.aio
    expose:
      - 9080
    networks:
      - common
    ports:
      - '3102:9080'
    environment:
      CLUSTER_NAME: "test_cluster_two_shards"
      CLICKHOUSE_SERVER: "e2e.clickhouse"
      CLICKHOUSE_AUTH: "qryn:q1w2e3r4"
      # The stack is configured with the current GIGAPIPE_ names, so a green
      # e2e run exercises shared/envalias against a real deployment. The
      # interpolation source stays QRYN_RULER_ENABLED because that is what the
      # Makefile exports.
      GIGAPIPE_LOGIN: a
      GIGAPIPE_PASSWORD: b
      GIGAPIPE_RULER_ENABLED: "${QRYN_RULER_ENABLED:-true}"
      METRICS_15S_ENABLED: "${METRICS_15S_ENABLED:-true}"
      BULK_MAX_AGE_MS: "100"
      PORT: "9080"
    command:
      - sh
      - -c
      - sleep 15 && /gigapipe
  e2e-clickhouse:
    extends:
      file: ../docker-compose.clickhouse.yml
      service: clickhouse
    container_name: e2e.clickhouse
    hostname: e2e.clickhouse
    volumes:
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
    networks:
      common:
        aliases:
          - "clickhouse_1"
    expose:
      - "2181"
      - "9444"
      - "9000"
  e2e-clickhouse2:
    extends:
      file: ../docker-compose.clickhouse.yml
      service: clickhouse
    container_name: e2e.clickhouse2
    hostname: e2e.clickhouse2
    volumes:
      - ./clickhouse/config2.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
    networks:
      common:
        aliases:
          - "clickhouse_2"
    expose:
      - "2181"
      - "9444"
      - "9000"
  # Runs the suite with `docker compose run`; the profile keeps `up` from
  # starting it.
  e2e-tests:
    image: node:18-alpine
    profiles:
      - tests
    networks:
      - common
    volumes:
      - ${E2E_TESTS_PATH:-../../../deps/gigapipe-tests}:/deps/e2e
    environment:
      INTEGRATION_E2E: "1"
      CLOKI_EXT_URL: "e2e.aio:9080"
      QRYN_LOGIN: a
      QRYN_PASSWORD: b
      QRYN_RULER_ENABLED: "${QRYN_RULER_ENABLED:-true}"
      OTEL_COLL_URL: "http://a:b@e2e.aio:9080"
    command:
      - sh
      - -c
      - cd /deps/e2e && npm install && npm test -- --forceExit


# CLUSTER_NAME=test_cluster_two_shards CLICKHOUSE_SERVER=e2e.clickhouse QRYN_LOGIN=a QRYN_PASSWORD=b BULK_MAX_AGE_MS=100 PORT=9080
